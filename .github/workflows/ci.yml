name: Enterprise Security & Regression CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-audit-and-tests:
    name: Red-Team Security & Regression Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Syntax Verification
        run: |
          python -m py_compile flight_agent.py
          python -m py_compile hotel_agent.py
          python -m py_compile travel_langgraph_agent.py

      - name: Execute 40-Point Security Regression Suite
        run: |
          pytest -v --durations=10

